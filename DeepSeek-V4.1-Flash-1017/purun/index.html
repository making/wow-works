<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぷるん — a crème caramel, in real time</title>
<style>
  :root{
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Songti SC", "Noto Serif JP", serif;
    --sans: "Helvetica Neue", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ink: rgba(255,244,230,.72);
    --ink-dim: rgba(255,244,230,.40);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#030202;overflow:hidden;overscroll-behavior:none}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:3}
  .label{position:absolute;opacity:0;animation:rise 2.6s cubic-bezier(.2,.7,.2,1) forwards}
  .k{font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-dim)}
  .v{font-size:9px;letter-spacing:.22em;margin-top:7px;color:rgba(255,244,230,.26)}
  .tl{left:clamp(20px,4vw,56px);top:clamp(20px,4vh,52px);animation-delay:3.4s}
  .tr{right:clamp(20px,4vw,56px);top:clamp(20px,4vh,52px);text-align:right;animation-delay:4.0s}
  .bl{left:clamp(20px,4vw,56px);bottom:clamp(22px,5vh,56px);animation-delay:4.6s}
  .br{right:clamp(20px,4vw,56px);bottom:clamp(22px,5vh,56px);text-align:right;animation-delay:5.2s}

  .title{
    font-family:var(--serif);
    font-size:clamp(19px,2.1vw,26px);
    letter-spacing:.42em;
    color:rgba(255,246,234,.78);
    font-weight:400;
  }
  .sub{
    margin-top:12px;display:flex;align-items:center;gap:12px;
    font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,244,230,.30);
  }
  .rule{width:38px;height:1px;background:linear-gradient(90deg,rgba(255,244,230,.36),rgba(255,244,230,0))}

  .fps{font-variant-numeric:tabular-nums}

  @keyframes rise{
    0%{opacity:0;transform:translateY(6px);filter:blur(3px)}
    100%{opacity:1;transform:translateY(0);filter:blur(0)}
  }

  #veil{
    position:fixed;inset:0;z-index:5;background:#030202;
    transition:opacity 2.8s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  #veil.gone{opacity:0}

  #nogl{
    position:fixed;inset:0;display:none;place-items:center;z-index:9;
    font-size:12px;letter-spacing:.2em;color:var(--ink-dim);
  }
  .no-webgl #nogl{display:grid}

  @media (max-width:640px){
    .title{font-size:17px;letter-spacing:.34em}
    .br{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="label tl">
    <div class="k">Crème Caramel</div>
    <div class="v">№ 001 — the wobble study</div>
  </div>
  <div class="label tr">
    <div class="k">Real time</div>
    <div class="v">no textures · no meshes · no photos</div>
  </div>
  <div class="label bl">
    <div class="title">ぷるん</div>
    <div class="sub"><span class="rule"></span><span>drag to wobble — 引いて触れる</span></div>
  </div>
  <div class="label br">
    <div class="k">sound on</div>
    <div class="v">every touch has a voice</div>
  </div>
</div>

<div id="veil"></div>
<div id="nogl">WebGL2 is required</div>

<script src="app.js"></script>
</body>
</html>
